spring.application.name=Otica
server.port=${PORT:8080}

# MySQL (schema "otica"). Usuário/senha ficam fora do git: em config/application.properties (local)
# ou nas variáveis DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/otica?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# As tabelas são criadas/atualizadas a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# JWT: obrigatório, mínimo 32 caracteres. Defina em config/application.properties ou na variável JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiracao-horas=12

# Usuário administrador criado no primeiro start (se não houver usuários).
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.senha=${ADMIN_SENHA:admin123}

# Origens liberadas para o front Angular (separadas por vírgula).
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
